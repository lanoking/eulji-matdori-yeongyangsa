.hud{position:absolute;left:8px;top:8px;font-size:12px;background:rgba(4,8,20,.72);border:1px solid var(--line);border-radius:8px;padding:6px 9px;line-height:1.55;pointer-events:none;min-width:128px}

.rail{position:absolute;right:8px;top:10%;bottom:10%;width:6px;border-radius:3px;background:rgba(255,255,255,.12);pointer-events:none}
.rail i{position:absolute;left:-2px;width:10px;height:10px;border-radius:50%;transform:translateY(-5px);box-shadow:0 0 6px currentColor}
